name: Windows build
on:
  push:
    branches: [codex/bootstrap-eq-visualizer]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check spectrum and scene geometry
        run: dotnet run --project tests/EQVisualizer.CoreChecks -c Release
      - name: Review Windows interface and edge cases
        run: dotnet run --project tests/EQVisualizer.WindowsReview -c Release -- TestResults/${{ matrix.arch }}/review
      - name: Publish executable
        run: dotnet publish src/EQVisualizer/EQVisualizer.csproj -c Release -r ${{ matrix.arch }} --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o out/${{ matrix.arch }}
      - name: Exercise published renderer
        shell: pwsh
        run: |
          $exe = Resolve-Path "out/${{ matrix.arch }}/EQVisualizer.exe"
          $result = Start-Process -FilePath $exe -ArgumentList "--smoke-test", "TestResults/${{ matrix.arch }}" -PassThru
          if (-not $result.WaitForExit(90000)) {
            Stop-Process -Id $result.Id -Force
            if (Test-Path "TestResults/${{ matrix.arch }}/smoke-progress.txt") { Get-Content "TestResults/${{ matrix.arch }}/smoke-progress.txt" }
            throw "Renderer smoke test exceeded 90 seconds"
          }
          Get-Content "TestResults/${{ matrix.arch }}/smoke-result.txt"
          if ($result.ExitCode -ne 0) { throw "Renderer smoke test failed: $($result.ExitCode)" }
      - name: Include licenses and user guide
        shell: pwsh
        run: |
          $destination = "out/${{ matrix.arch }}"
          if (Test-Path "$destination/EQVisualizer.pdb") { throw "Debug symbols must not be packaged" }
          Copy-Item LICENSE, README.md, COMPATIBILITY.md, THIRD-PARTY-NOTICES.txt $destination
          $licenseDirectory = New-Item -ItemType Directory -Force "$destination/licenses"
          $packages = Join-Path $env:USERPROFILE ".nuget/packages"
          $assets = Get-Content "src/EQVisualizer/obj/project.assets.json" -Raw | ConvertFrom-Json
          $dependencies = @($assets.libraries.PSObject.Properties.Name | ForEach-Object { $_.ToLowerInvariant() })
          $dependencies += "microsoft.netcore.app.runtime.${{ matrix.arch }}"
          $dependencies += "microsoft.windowsdesktop.app.runtime.${{ matrix.arch }}"
          foreach ($dependency in $dependencies) {
            $directory = Join-Path $packages $dependency
            if (-not (Test-Path $directory)) { continue }
            Get-ChildItem $directory -Recurse -File -Include "*LICENSE*","*NOTICE*" | ForEach-Object {
              $relative = $_.FullName.Substring($packages.Length + 1)
              $target = Join-Path $licenseDirectory.FullName $relative
              New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
              Copy-Item $_.FullName $target
            }
          }
          $hash = (Get-FileHash "$destination/EQVisualizer.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EQVisualizer.exe" | Set-Content "$destination/SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: EQVisualizer-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.arch }}
          path: TestResults/${{ matrix.arch }}/
          if-no-files-found: warn

  private-assets:
    needs: build
    if: github.event_name == 'push' && github.repository == 'TKGHyper42/EQ-Visualizer' && github.event.repository.private && contains(github.event.head_commit.message, '[private-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EQVisualizer-win-*
          path: binaries
      - name: Prepare executable and ZIP downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          for arch in win-x64 win-x86; do
            test -f "binaries/EQVisualizer-$arch/EQVisualizer.exe"
            (cd "binaries/EQVisualizer-$arch" && tr -d '\r' < SHA256.txt | sha256sum --check --strict)
            cp "binaries/EQVisualizer-$arch/EQVisualizer.exe" "downloads/EQVisualizer-$arch.exe"
            (cd "binaries/EQVisualizer-$arch" && zip -q -r "../../downloads/EQVisualizer-$arch.zip" .)
          done
          (cd downloads && sha256sum EQVisualizer-win-x64.exe EQVisualizer-win-x86.exe EQVisualizer-win-x64.zip EQVisualizer-win-x86.zip > SHA256SUMS.txt)
      - name: Store downloads in an unpublished private release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/TKGHyper42/EQ-Visualizer --jq '.private')" = true
          tag="private-build-$GITHUB_RUN_ID"
          gh release create "$tag" --repo TKGHyper42/EQ-Visualizer --target "$GITHUB_SHA" \
            --title "EQ Visualizer — compilación privada de prueba" --draft --prerelease \
            --notes "Compilaciones de prueba para Windows x64 y x86. Extrae el ZIP completo y ejecuta EQVisualizer.exe. Los ZIP incluyen la guía y las licencias de distribución." \
            downloads/EQVisualizer-win-x64.exe downloads/EQVisualizer-win-x86.exe \
            downloads/EQVisualizer-win-x64.zip downloads/EQVisualizer-win-x86.zip downloads/SHA256SUMS.txt
          gh release view "$tag" --repo TKGHyper42/EQ-Visualizer --json isDraft,isPrerelease,url,tagName,assets
          test "$(gh api repos/TKGHyper42/EQ-Visualizer --jq '.private')" = true
          test "$(gh release view "$tag" --repo TKGHyper42/EQ-Visualizer --json isDraft --jq '.isDraft')" = true

