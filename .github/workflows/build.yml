name: Windows build
on:
  push:
    branches: [main, codex/bootstrap-eq-visualizer, patch/v2-v3-win11-x64-20261111, release/v1.0.1-beta.1]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publicar una nueva prerelease SOLO tras validación y aprobación explícita'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check spectrum and scene geometry
        run: dotnet run --project tests/EQVisualizer.CoreChecks -c Release
      - name: Review Windows interface and edge cases
        run: dotnet run --project tests/EQVisualizer.WindowsReview -c Release -- TestResults/${{ matrix.arch }}/review
      - name: Publish executable
        run: dotnet publish src/EQVisualizer/EQVisualizer.csproj -c Release -r ${{ matrix.arch }} --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o out/${{ matrix.arch }}
      - name: Exercise published renderer
        shell: pwsh
        run: |
          $exe = Resolve-Path "out/${{ matrix.arch }}/EQVisualizer.exe"
          $result = Start-Process -FilePath $exe -ArgumentList "--smoke-test", "TestResults/${{ matrix.arch }}" -PassThru
          if (-not $result.WaitForExit(180000)) {
            Stop-Process -Id $result.Id -Force
            if (Test-Path "TestResults/${{ matrix.arch }}/smoke-progress.txt") { Get-Content "TestResults/${{ matrix.arch }}/smoke-progress.txt" }
            throw "Renderer smoke test exceeded 180 seconds"
          }
          Get-Content "TestResults/${{ matrix.arch }}/smoke-result.txt"
          if ($result.ExitCode -ne 0) { throw "Renderer smoke test failed: $($result.ExitCode)" }
      - name: Include licenses and user guide
        shell: pwsh
        run: |
          $destination = "out/${{ matrix.arch }}"
          if (Test-Path "$destination/EQVisualizer.pdb") { throw "Debug symbols must not be packaged" }
          Copy-Item LICENSE, README.md, COMPATIBILITY.md, THIRD-PARTY-NOTICES.txt, PRIVACY.md, LEGAL.md, SECURITY.md $destination
          $licenseDirectory = New-Item -ItemType Directory -Force "$destination/licenses"
          $packages = Join-Path $env:USERPROFILE ".nuget/packages"
          $assets = Get-Content "src/EQVisualizer/obj/project.assets.json" -Raw | ConvertFrom-Json
          $dependencies = @($assets.libraries.PSObject.Properties.Name | ForEach-Object { $_.ToLowerInvariant() })
          $dependencies += "microsoft.netcore.app.runtime.${{ matrix.arch }}"
          $dependencies += "microsoft.windowsdesktop.app.runtime.${{ matrix.arch }}"
          foreach ($dependency in $dependencies) {
            $directory = Join-Path $packages $dependency
            if (-not (Test-Path $directory)) { continue }
            Get-ChildItem $directory -Recurse -File -Include "*LICENSE*","*NOTICE*" | ForEach-Object {
              $relative = $_.FullName.Substring($packages.Length + 1)
              $target = Join-Path $licenseDirectory.FullName $relative
              New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
              Copy-Item $_.FullName $target
            }
          }
          $sdkLicenseDirectory = New-Item -ItemType Directory -Force "$destination/licenses/windows-sdk"
          $sdkLicense = Join-Path $sdkLicenseDirectory.FullName "LICENSE.rtf"
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/0/F/F/0FF2B061-47DD-4F55-89B6-FD1D8C44F14D/sdk_license.rtf" -OutFile $sdkLicense
          if ((Get-FileHash $sdkLicense -Algorithm SHA256).Hash.ToLowerInvariant() -ne "dd07eb178e00c6bba4148457fc00ff77cd4887eb521d504186fe59c9ec8bbe62") {
            throw "Windows SDK license differs from the reviewed document"
          }
          $hash = (Get-FileHash "$destination/EQVisualizer.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EQVisualizer.exe" | Set-Content "$destination/SHA256.txt"

      # Do not consume artifact storage for ordinary development commits.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/codex/bootstrap-eq-visualizer' && contains(github.event.head_commit.message, '[private-build]'))
        with:
          name: EQVisualizer-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: checks-${{ matrix.arch }}
          path: TestResults/${{ matrix.arch }}/
          retention-days: 1
          if-no-files-found: warn
  # Release publication is a separate job with write permission, never a side
  # effect of a push. Only an explicit manual dispatch on the release branch
  # can attempt publication, and existing release tags are never overwritten.
  publish-prerelease:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease == true && github.ref == 'refs/heads/release/v1.0.1-beta.1' && github.repository == 'TKGHyper42/EQ-Visualizer'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EQVisualizer-win-x64
          path: out/win-x64
      - name: Verify artifact and publish explicitly approved prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.0.1-beta.1'
          $repo = '${{ github.repository }}'
          if ($repo -ne 'TKGHyper42/EQ-Visualizer') { throw 'Unexpected release repository' }
          $expected = (Get-Content 'out/win-x64/SHA256.txt' -Raw).Trim().Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].ToLowerInvariant()
          $actual = (Get-FileHash 'out/win-x64/EQVisualizer.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Artifact checksum mismatch' }
          gh release view $tag --repo $repo > $null 2> $null
          if ($LASTEXITCODE -eq 0) { throw "Prerelease $tag already exists; refusing to overwrite assets" }
          New-Item -ItemType Directory -Force 'dist' | Out-Null
          Copy-Item 'out/win-x64/EQVisualizer.exe' 'dist/EQVisualizer-win-x64.exe'
          Compress-Archive -Path 'out/win-x64/*' -DestinationPath 'dist/EQVisualizer-win-x64.zip'
          @('EQVisualizer-win-x64.exe', 'EQVisualizer-win-x64.zip') | ForEach-Object {
            $digest = (Get-FileHash -Path ("dist/" + $_) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $_"
          } | Set-Content -Path 'dist/SHA256SUMS.txt' -Encoding ascii
          $notes = @(
            'Prerelease experimental de mantenimiento para Windows 11 x64.',
            '',
            'Compilada tras CoreChecks, WindowsReview y smoke test del ejecutable en GitHub Actions.',
            'Las pruebas con audio real, Explorador de Windows y varios monitores siguen pendientes.',
            'No sustituye automáticamente a la beta pública.',
            '',
            'Comprueba los archivos usando SHA256SUMS.txt antes de ejecutarlos.'
          ) -join "`n"
          gh release create $tag 'dist/EQVisualizer-win-x64.exe' 'dist/EQVisualizer-win-x64.zip' 'dist/SHA256SUMS.txt' --repo $repo --target $env:GITHUB_SHA --title 'EQ Visualizer v1.0.1-beta.1 (prerelease)' --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish prerelease' }

