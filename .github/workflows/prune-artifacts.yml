name: Prune old EQ artifacts
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe PRUNE para autorizar la eliminación de artefactos antiguos (no releases)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prune:
    if: github.repository == 'TKGHyper42/EQ-Visualizer' && github.actor == 'TKGHyper42' && inputs.confirm == 'PRUNE'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Preserve the validated hybrid build and prune outdated artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const {owner,repo} = context.repo;
            const pinned = new Set([13847007291, 13847196867]);
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner,repo,per_page:100});
            const candidates = all.filter(a => /^(EQVisualizer-|checks-)/.test(a.name))
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            const seen = new Set();
            for (const artifact of candidates) {
              // Keep the latest artifact of each name and the tested V2+V3 build.
              if (!seen.has(artifact.name) || pinned.has(artifact.id)) {
                seen.add(artifact.name);
                core.info('Preserving ' + artifact.name + ': ' + artifact.id);
                continue;
              }
              await github.rest.actions.deleteArtifact({owner,repo,artifact_id:artifact.id});
              core.info('Deleted stale artifact ' + artifact.name + ': ' + artifact.id);
            }
